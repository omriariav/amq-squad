name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v3

permissions:
  contents: read

jobs:
  make-ci:
    name: make ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect release validation scope
        if: github.event_name == 'pull_request'
        id: release
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python3 scripts/detect-release-ci.py \
            --base "$BASE_SHA" \
            --head-ref "$HEAD_REF" | tee -a "$GITHUB_OUTPUT"

      - name: Run release metadata check
        if: github.event_name == 'pull_request' && steps.release.outputs.run_release_check == 'true'
        run: make release-check VERSION="${{ steps.release.outputs.release_version }}"

      - name: Install documentation tools
        run: |
          curl -L https://github.com/jgm/pandoc/releases/download/3.8.3/pandoc-3.8.3-1-amd64.deb -o /tmp/pandoc.deb
          sudo dpkg -i /tmp/pandoc.deb

      - name: Run shuffled internal/cli evidence suite
        shell: bash
        run: |
          mkdir -p ci-artifacts
          set +e
          go test -json -shuffle=on -timeout=15m ./internal/cli > ci-artifacts/internal-cli.json
          status=$?
          set -e
          seed="$(sed -nE 's/.*-test\.shuffle ([0-9]+).*/\1/p' ci-artifacts/internal-cli.json | head -n 1)"
          if [[ -z "$seed" ]]; then
            seed=unknown
          fi
          printf 'shuffle_seed=%s\nexit_code=%s\n' "$seed" "$status" | tee ci-artifacts/internal-cli-metadata.txt
          exit "$status"

      - name: Upload shuffled internal/cli evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: internal-cli-go-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Run make ci
        run: make ci

  # Real AMQ lanes (brief 5-amq-A fix round). One floor for one binary: the
  # pinned lane runs the release go.mod pins and doctor requires (v0.116.2)
  # and is required; the canary runs AMQ's newest release and is
  # non-blocking (continue-on-error), because its failure reads as upstream
  # drift to look at, not as a break of this repository. macOS, the 3.0 host,
  # with tmux for the launch-backed proofs. The lane runs every test gated on
  # AMQ_SQUAD_REAL_AMQ.
  real-amq-compatibility:
    name: real AMQ compatibility (${{ matrix.lane }} ${{ matrix.amq-version }})
    runs-on: macos-latest
    continue-on-error: ${{ matrix.canary }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: pinned, amq-version: v0.116.2, canary: false }
          - { lane: canary, amq-version: latest, canary: true }
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tmux and requested AMQ
        shell: bash
        run: |
          set -euo pipefail
          command -v tmux >/dev/null || brew install tmux
          export GOBIN="$RUNNER_TEMP/amq-bin"
          mkdir -p "$GOBIN"
          go install github.com/avivsinai/agent-message-queue/cmd/amq@${{ matrix.amq-version }}
          tmux -V
          "$GOBIN/amq" version

      - name: Run the real-AMQ lane
        shell: bash
        env:
          AMQ_SQUAD_REAL_AMQ: ${{ runner.temp }}/amq-bin/amq
          AMQ_SQUAD_REAL_AMQ_VERSION: ${{ matrix.amq-version }}
          AMQ_NO_UPDATE_CHECK: "1"
          CLI_TESTS: "^(TestRealAMQ.*|TestRealLaunchapiInspectSessionTargetShape|TestNestedWorktreeRootDiscoveryOnAMQ074)$"
          LIBRARY_TESTS: "^(TestCompiledIntentAcceptedByReleasedAMQ|TestApplyForwardsSubjectSchemaFromPrepareResult)$"
        run: |
          set -euo pipefail
          "$AMQ_SQUAD_REAL_AMQ" version
          go test ./internal/cli -run "$CLI_TESTS" -count=1 -v -timeout=10m
          go test ./internal/launchintent ./internal/adoptionseam -run "$LIBRARY_TESTS" -count=1 -v -timeout=10m

  # v3 phase 5: the Claude hook script under dash, which is /bin/sh on
  # ubuntu. The script runs through /bin/sh in Claude Code's hook runner, so
  # the Linux lane proves it is POSIX-clean, not bash-only.
  claude-hooks-linux:
    name: Claude hook script (dash, linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build amq-squad
        run: go build -o amq-squad ./cmd/amq-squad

      - name: Run the Claude hook script tests under dash
        shell: bash
        env:
          HOOK_SHELL: dash
        run: |
          set -euo pipefail
          command -v dash
          python3 scripts/test_claude_hooks.py ./amq-squad Repass5
