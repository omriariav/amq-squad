# amq-squad 3.0 keep/delete manifest (task S7, plan 16.1)
# One entry per non-test Go file under internal/. v2_lines are wc -l counts on branch v3.
# Strict line format (parsed by scripts/manifest-check.sh with awk; do not reflow or reorder):
#   - path: <file>        starts an entry; these keys follow, one per line, in this order:
#     v2_lines, fate (keep|shrink|delete|replace|review), target_lines, cluster, extract, reason, status
#   status: pending | deleted | trimmed | shrunk | keep | deferred-replace | deferred-2b | deferred-3 |
#   accepted-3 | new. fate new (status new) marks a 3.0 addition (2a-3): v2_lines 0, target_lines equal to
#   its size and informational; manifest-check keeps new rows out of the target-sum rule and the band gate.
#   Executors flip it to deleted in the commit that deletes the file; every status but pending
#   and deleted carries current_lines after v2_lines (see scripts/manifest-check.sh header for each status).
#   At the close of 2a-2 no row is pending or trimmed.
#   extract and reason are double-quoted strings with no inner double quotes.
#   note (optional, after status): a "2a-2 debit" note marks a 2a-1 holding file; manifest-check lists it.
#   replaced_by, retired_in (optional, after status, before note; 2b-5 merge ruling): a row retired from 2b on
#   (deleted, or shrunk below half its target) names its fate-new replacement row or "<brief> acceptance <n>" in
#   replaced_by; retired_in names the brief when the note does not (manifest-check check 8).
#   deferred-2b, deferred-3 and accepted-3 rows carry a note quoting their class and manifest reason.
#
# Owner defaults applied (plan 4.4, bracketed defaults):
#   - bootstrapack: delete.
#   - fleet registry in global_noc.go: keep (about 150 lines).
#   - down: returns as a thin stop-squad verb, about 150 lines, phase 2b (inside the C11 400 budget).
#   - commandevidence/subject.go: kept, 400 lines, ported into guard (adds 400 to the 4.2 total).
#
# Target-line distribution rules for shrink clusters and packages:
#   1. Where the manifest-pass report or section 4 names a per-file figure, it is used; the rest is set
#      by hand so the cluster sums to the section 4.3 figure (C3, C7, C11, C12, C13, C14, C17, C18, C19,
#      C23, C26, C27).
#   2. Otherwise the cluster or package target is split proportionally to v2_lines (rounded; the
#      remainder goes to the largest file).
#   3. Files cut or extracted away entirely get 0. In a delete cluster with a nonzero 4.3 figure
#      (C4, C7, C11, C28) the host files named in extract carry the budget with fate shrink.
#   4. fate=keep when the cluster/package table says keep, or target >= 95 percent of v2_lines;
#      fate=review marks files the research flags for line-by-line or pane-reference review.

# decisions: lead decisions that manifest-check --final honors (see scripts/manifest-check.sh).
decisions: [end-of-2a-2]
